name: Build VCam Rootless .deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install make ldid

      - name: Clone Theos & SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          curl -LO https://github.com/theos/sdks/releases/download/v14.5/iPhoneOS14.5.sdk.tar.xz
          mkdir -p $HOME/theos/sdks
          tar -xf iPhoneOS14.5.sdk.tar.xz -C $HOME/theos/sdks

      - name: Prepare Theos environment
        run: |
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Make build script executable
        run: |
          chmod +x build.sh

      - name: Run build script
        run: |
          ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcam-rootless-deb
          path: "*.deb"