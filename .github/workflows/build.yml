name: Build VCam Rootless .deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          xcode-select --install || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          brew install make ldid || true

      - name: Clone Theos
        run: |
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          ls -la "$HOME/theos"
          ls -la "$HOME/theos/bin" || true
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Make build script executable
        run: |
          chmod +x build.sh

      - name: Run build script
        env:
          THEOS: ${{ env.THEOS }}
        run: |
          export PATH="$THEOS/bin:$PATH"
          ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vcam-rootless-deb
          path: |
            packages/*.deb
          if-no-files-found: error